name: install-warp
description: To install warp client on github runner

inputs:
  warp_auth_client_id:
    required: true
    description: "Warp Client Id"
  warp_auth_client_secret:
    required: true
    description: "Warp Client Secret"
  warp_tunnel_id:
    required: true
    description: "Warp Tunnel Id"

runs:
  using: composite
  steps:
    - name: Install Warp
      run: |
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        sudo apt-get update && sudo apt-get install cloudflare-warp -y
        cd /var/lib/cloudflare-warp
        sudo touch mdm.xml
        sudo bash -c "echo '<dict>' > mdm.xml"
        sudo bash -c "echo '  <key>organization</key>' >> mdm.xml"
        sudo bash -c "echo '  <string>atlas-consolidated</string>' >> mdm.xml"
        sudo bash -c "echo '  <key>auth_client_id</key>' >> mdm.xml"
        sudo bash -c "echo '  <string>${{ inputs.warp_auth_client_id }}</string>' >> mdm.xml"
        sudo bash -c "echo '  <key>auth_client_secret</key>' >> mdm.xml"
        sudo bash -c "echo '  <string>${{ inputs.warp_auth_client_secret }}</string>' >> mdm.xml"
        sudo bash -c "echo '</dict>' >> mdm.xml"
        warp-cli --accept-tos connect
        echo "Waiting (~15 seconds) for connection to establish"
        sleep 15s
        warp-cli --accept-tos status
        warp-cli --accept-tos vnet ${{ inputs.warp_tunnel_id }}
      shell: bash
